    /*************************************************************************

    function createRadialGlowTexture(rgbaCenter, rgbaMid) {
      const c = document.createElement('canvas');
      c.width = 256; c.height = 256;
      const ctx = c.getContext('2d');
      const grad = ctx.createRadialGradient(128, 128, 6, 128, 128, 124);
      grad.addColorStop(0, rgbaCenter);
      grad.addColorStop(0.42, rgbaMid);
      grad.addColorStop(1, 'rgba(224, 83, 44, 0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 256, 256);
      return new THREE.CanvasTexture(c);
    }

    function normLook(v) {
      if (v === true) return 'clay';
      if (v === false) return 'real';
      return v || 'clay';
    }

    function createLidTexture(look) {
      look = normLook(look);
      const T = {
        clay: { bg: '#f2f0ea', box: '#2b2b29', name: '#222220', acc: '#e0532c', sub: '#6e6c65' },
        dark: { bg: '#23252b', box: 'rgba(255,255,255,0.30)', name: '#f2f1ec', acc: '#ff7a4d', sub: '#a5a39b' },
        real: { bg: '#1b1e24', box: 'rgba(255,255,255,0.22)', name: '#f8fafc', acc: '#38bdf8', sub: '#94a3b8' }
      }[look];
      const c = document.createElement('canvas');
      c.width = 1024; c.height = 768;
      const ctx = c.getContext('2d');
      ctx.fillStyle = T.bg;
      ctx.fillRect(0, 0, 1024, 768);

      ctx.strokeStyle = T.box;
      ctx.lineWidth = 4;
      ctx.strokeRect(230, 220, 564, 320);

      ctx.fillStyle = T.name;
      ctx.font = 'bold 90px "Space Grotesk", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('Enfibio', 512, 355);

      ctx.fillStyle = T.acc;
      ctx.font = 'bold 46px "JetBrains Mono", monospace';
      ctx.fillText('V2X AI', 512, 430);

      ctx.fillStyle = T.sub;
      ctx.font = '600 20px "JetBrains Mono", monospace';
      ctx.fillText('CUSTOM C-V2X (PC5) + BLE HYBRID UNIT', 512, 495);
      return new THREE.CanvasTexture(c);
    }

    function createPCBTexture(look) {
      look = normLook(look);
      const T = {
        clay: { bg: '#e9e7e0', trace: '#cfcdc4', via: '#b8b5ab' },
        dark: { bg: '#1d1f23', trace: '#34373d', via: '#4d5058' },
        real: { bg: '#0b4623', trace: '#15803d', via: '#eab308' }
      }[look];
      const c = document.createElement('canvas');
      c.width = 1024; c.height = 800;
      const ctx = c.getContext('2d');
      ctx.fillStyle = T.bg;
      ctx.fillRect(0, 0, 1024, 800);

      ctx.strokeStyle = T.trace;
      ctx.lineWidth = 3;
      for (let i = 0; i < 85; i++) {
        const x = 60 + (i * 97) % 880;
        const y = 50 + (i * 53) % 690;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + 70, y);
        ctx.lineTo(x + 95, y + 25);
        ctx.stroke();
      }
      for (let i = 0; i < 180; i++) {
        ctx.fillStyle = T.via;
        ctx.beginPath();
        ctx.arc(48 + (i * 73) % 920, 48 + (i * 41) % 700, 3, 0, Math.PI * 2);
        ctx.fill();
      }
      return new THREE.CanvasTexture(c);
    }

    function createShieldLabelTexture(title, sub, look) {
      look = normLook(look);
      const T = {
        clay: { bg: '#f7f6f1', line: '#2b2b29', brand: '#e0532c', title: '#222220', sub: '#5a5852', bar: '#222220' },
        dark: { bg: '#2e3036', line: '#d2d1ca', brand: '#ff7a4d', title: '#f2f1ec', sub: '#a5a39b', bar: '#ff7a4d' },
        real: { bg: '#d4d8e0', line: '#2b2b29', brand: '#c2410c', title: '#16161a', sub: '#44434a', bar: '#16161a' }
      }[look];
      const c = document.createElement('canvas');
      c.width = 512; c.height = 512;
      const ctx = c.getContext('2d');
      ctx.scale(2, 2);                       // draw in a 256x256 space, rendered at 2x for crisp text
      ctx.fillStyle = T.bg;
      ctx.fillRect(0, 0, 256, 256);
      ctx.strokeStyle = T.line;
      ctx.lineWidth = 6;
      ctx.strokeRect(8, 8, 240, 240);

      // shrink-to-fit so long names (e.g. POWER MODULE) never get clipped
      const fit = (text, px, maxW, weight, family) => {
        ctx.font = `${weight} ${px}px ${family}`;
        while (ctx.measureText(text).width > maxW && px > 10) {
          px -= 1;
          ctx.font = `${weight} ${px}px ${family}`;
        }
      };
      ctx.textAlign = 'left';
      ctx.textBaseline = 'alphabetic';

      ctx.fillStyle = T.brand;
      fit('ENFIBIO', 30, 212, 'bold', '"JetBrains Mono", monospace');
      ctx.fillText('ENFIBIO', 22, 56);

      ctx.fillStyle = T.line;
      ctx.fillRect(22, 70, 212, 3);

      ctx.fillStyle = T.title;
      fit(title, 40, 212, 'bold', '"Space Grotesk", sans-serif');
      ctx.fillText(title, 22, 134);

      ctx.fillStyle = T.sub;
      fit(sub, 22, 212, '600', '"JetBrains Mono", monospace');
      ctx.fillText(sub, 22, 176);

      ctx.fillStyle = T.bar;
      ctx.fillRect(22, 204, 90, 8);
      return new THREE.CanvasTexture(c);
    }

    function createRulerBaseTexture(dark) {
      const T = dark
        ? { bg: '#1d1f24', grid: 'rgba(255,255,255,0.10)', tick: '#a9a8a1' }
        : { bg: '#efede7', grid: 'rgba(43, 43, 41, 0.14)', tick: '#383835' };
      const c = document.createElement('canvas');
      c.width = 1024; c.height = 1024;
      const ctx = c.getContext('2d');
      ctx.fillStyle = T.bg;
      ctx.fillRect(0, 0, 1024, 1024);

      // Subtle technical grid inside the test-stand pad
      ctx.strokeStyle = T.grid;
      ctx.lineWidth = 2;
      for (let i = 128; i <= 896; i += 64) {
        ctx.beginPath(); ctx.moveTo(i, 128); ctx.lineTo(i, 896); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(128, i); ctx.lineTo(896, i); ctx.stroke();
      }

      // Ruler ticks along the front-left edge (matching Raptor 2 Test Stand baseplate)
      ctx.strokeStyle = T.tick;
      ctx.lineWidth = 2.5;
      for (let t = 80; t <= 944; t += 16) {
        const len = (t % 64 === 0) ? 26 : 12;
        ctx.beginPath();
        ctx.moveTo(t, 980);
        ctx.lineTo(t, 980 - len);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(44, t);
        ctx.lineTo(44 + len, t);
        ctx.stroke();
      }
      return new THREE.CanvasTexture(c);
    }

      const edgesGeo = new THREE.EdgesGeometry(mesh.geometry, thresholdAngle);
      const edgesMat = new THREE.LineBasicMaterial({

        transparent: true,
        opacity: opacity

      const line = new THREE.LineSegments(edgesGeo, edgesMat);

    ].forEach(([px, pz]) => {
      const p = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.32, 1.05, 16), pillarMat);
      p.position.set(px, 0.72, pz);
      addTechnicalInkOutlines(p, 0.6);

    // Engraved Nameplate on front-right of Test Stand
    const plateMesh = new THREE.Mesh(
      new THREE.BoxGeometry(2.6, 0.1, 0.65),
      new THREE.MeshStandardMaterial({ color: 0xdcd9d0, roughness: 0.5 })
    );

    // Volumetric Warm Orange/Red Thermal & RF Plume Effect (Matches Raptor 2 Plume)

    function registerPart(id, group, explodeVec, anchorOffset = new THREE.Vector3(0, 0.5, 0)) {
      const meshes = [];
      const lines = [];
      group.traverse((child) => {
        if (child.isMesh) {
          child.material = child.material.clone();
          child.castShadow = true;
          child.receiveShadow = true;
          child.userData.partId = id;
          meshes.push(child);
          interactiveMeshes.push(child);
        }
        if (child.isLineSegments) {
          child.material = child.material.clone();
          lines.push(child);
        }
      });
      partRegistry[id] = {
        id,
        group,
        basePos: group.position.clone(),
        explodeVec: explodeVec.clone(),
        anchorOffset,
        meshes,
        lines,
        focusMix: 1.0
      };
    }

    /*************************************************************************

    const calloutContainer = document.getElementById('callout-container');
    const pinDOMRegistry = {};

    function init3DPins() {
      calloutContainer.innerHTML = '';
      PIN_ITEMS.forEach((item) => {
        const badge = document.createElement('div');
        badge.className = 'pin-badge';
        badge.innerHTML = `
          <span class="px-1 py-0.2 rounded text-[9px] font-bold text-white" style="background:${item.color}">${item.code}</span>
          <span>${item.label}</span>
        `;
        badge.onclick = (e) => {

        pinDOMRegistry[item.id] = { item, badge };
      });

    init3DPins();

    // Direct 3D Hover & Click Raycasting on the Model
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let pointerDownPos = { x: 0, y: 0 };

    renderer.domElement.addEventListener('pointerdown', (e) => {
      pointerDownPos = { x: e.clientX, y: e.clientY };
    });

    renderer.domElement.addEventListener('pointermove', (e) => {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      const hits = raycaster.intersectObjects(interactiveMeshes, false);
      const readout = document.getElementById('hovered-part-readout');
      if (hits.length > 0) {
        const pid = hits[0].object.userData.partId;
        const pinMeta = PIN_ITEMS.find(p => p.id === pid);
        if (pinMeta) {
          readout.textContent = `INSPECTING [${pinMeta.code}] · ${pinMeta.label.toUpperCase()}`;
        }
      } else {
        readout.textContent = 'ENFIBIO V2X AI · HYBRID C-V2X (PC5) + BLE UNIT';
      }
    });

    renderer.domElement.addEventListener('pointerup', (e) => {
      const dist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
      if (dist > 6) return; // Ignore drag-orbit gestures

      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      const hits = raycaster.intersectObjects(interactiveMeshes, false);
      if (hits.length > 0) {
        const pid = hits[0].object.userData.partId;
        const pinMeta = PIN_ITEMS.find(p => p.id === pid);
        if (pinMeta) {
          selectChapter(pinMeta.chapter, true);
        }
      }
    });

    /*************************************************************************
     * 9. STATE ENGINE: SELECTIVE BLUR, CHAPTER SCROLL, & UI CONTROLS
     *************************************************************************/
    let activeChapterIdx = 0;
    let focusBlurEnabled = true;
    let rfPlumeActive = true;
    let currentExplode = 0;
    let targetExplode = 0;
    const desiredCamPos = new THREE.Vector3(14.5, 11.2, 16.5);
    const desiredCamTarget = new THREE.Vector3(1.4, 0.4, 0);

    function selectChapter(idx, scrollPaneToCard = false) {
      activeChapterIdx = idx;
      const ch = SCROLL_CHAPTERS[idx];
      if (!ch) return;

      // Update Card Focus / Blur
      SCROLL_CHAPTERS.forEach((_, i) => {
        const c = document.getElementById(`card-${i}`);
        if (c) {
          if (i === idx || !focusBlurEnabled) {
            c.classList.add('active-card');
          } else {
            c.classList.remove('active-card');
          }
        }
        const dot = document.getElementById(`dot-circle-${i}`);
        const lbl = document.getElementById(`dot-label-${i}`);
        if (dot && lbl) {
          if (i === idx) {
            dot.className = 'w-3 h-3 rounded-full bg-[#e0532c] transition-all duration-300';
            lbl.className = 'font-mono-tech text-[10px] text-[#222220] font-bold opacity-100 transition whitespace-nowrap';
          } else {
            dot.className = 'w-2 h-2 rounded-full bg-[#c5c3bc] transition-all duration-300';
            lbl.className = 'font-mono-tech text-[10px] text-[#6e6c65] opacity-0 group-hover:opacity-100 transition whitespace-nowrap';
          }
        }
      });

      if (scrollPaneToCard) {
        const cardEl = document.getElementById(`card-${idx}`);
        if (cardEl) {
          cardEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      }

      // Update Explode Target & Smooth Camera Glide
      targetExplode = ch.explodeTarget;
      document.getElementById('explode-slider').value = Math.round(targetExplode * 100);
      document.getElementById('explode-pct').textContent = `${Math.round(targetExplode * 100)}%`;

      desiredCamPos.set(...ch.camPos);
      desiredCamTarget.set(...ch.camTarget);
      cameraTransitioning = true;

      // Update 3D Callout Badges (Note: Chapter 02 focuses ALL 4 ANTENNAS at once!)
      Object.values(pinDOMRegistry).forEach(({ item, badge }) => {
        const isFocused = ch.focusParts.includes('ALL') || ch.focusParts.includes(item.id);
        if (!focusBlurEnabled || isFocused) {
          badge.classList.add('pin-focused');
          badge.classList.remove('pin-blurred');
        } else {
          badge.classList.remove('pin-focused');
          badge.classList.add('pin-blurred');
        }
      });
    }

    // Scroll Listener on Left Hardware Pane
    const scrollPane = document.getElementById('chapter-scroll-pane');
    scrollPane.addEventListener('scroll', () => {
      const paneRect = scrollPane.getBoundingClientRect();
      const paneCenter = paneRect.top + paneRect.height * 0.42;
      let closestIdx = activeChapterIdx;
      let minDist = Infinity;

      SCROLL_CHAPTERS.forEach((_, idx) => {
        const card = document.getElementById(`card-${idx}`);
        if (card) {
          const r = card.getBoundingClientRect();
          const cCenter = r.top + r.height / 2;
          const d = Math.abs(cCenter - paneCenter);
          if (d < minDist) {
            minDist = d;
            closestIdx = idx;
          }
        }
      });

      if (closestIdx !== activeChapterIdx) {
        selectChapter(closestIdx, false);
      }
    }, { passive: true });

    // Which finish is active: 'clay' | 'dark' (clay, dark mode) | 'real' (anodized & PCB)
    function currentLook() {
      return isClayStyle ? (isDarkTheme ? 'dark' : 'clay') : 'real';
    }

    // Re-skin every part for the active finish (called by the Style toggle, the Theme toggle and on load)
    function applyMaterialStyle() {
      const look = currentLook();
      const modePalette = look === 'real' ? PALETTE.realistic : (look === 'dark' ? PALETTE.clayDark : PALETTE.clay);
      const swapMap = (mat, tex) => { if (mat.map) mat.map.dispose(); mat.map = tex; mat.needsUpdate = true; };

      Object.values(partRegistry).forEach((reg) => {
        reg.meshes.forEach((m) => {
          const mat = m.material;
          if (!mat || mat.userData.isLed) return;
          const role = mat.userData.role;
          if (role === 'lid_top') {
            swapMap(mat, createLidTexture(look));
          } else if (role === 'main_pcb') {
            swapMap(mat, createPCBTexture(look));
          } else if (role === 'shield_can') {
            swapMap(mat, createShieldLabelTexture(mat.userData.title, mat.userData.sub, look));
            mat.metalness = look === 'real' ? 0.82 : 0.18;
            mat.roughness = look === 'real' ? 0.28 : 0.55;
          } else if (role && modePalette[role] !== undefined) {
            mat.color.setHex(modePalette[role]);
            mat.metalness = look === 'real' ? (role === 'brass' ? 0.9 : role === 'alu' ? 0.85 : 0.55) : (look === 'dark' ? (role === 'alu' ? 0.5 : 0.16) : 0.08);
            mat.roughness = look === 'real' ? 0.35 : (look === 'dark' ? 0.6 : 0.72);
          }
        });
      });
    }

      // Technical ink outlines: light lines (a bit softer) on dark parts, dark lines on light parts
      edgeScale = dark ? 0.6 : 1;
      allInkLines.forEach((ln) => {
        ln.material.color.setHex(dark ? 0xd2d1ca : inkEdgeColor);
        ln.material.opacity = (ln.userData.baseEdgeOpacity || 0.75) * edgeScale;
      });

      // The model itself (clay -> dark clay, labels, PCB, lid)

        ? 'w-2 h-2 rounded-full bg-emerald-600'
        : 'w-2 h-2 rounded-full bg-stone-400';

    // ---- Keep the 3D model centred in the space NOT covered by the right-hand specs panel ----
    let viewShift = 0;
    let appliedShift = null;
    function applyViewOffset(force) {
      const W = window.innerWidth, H = window.innerHeight;
      let target = 0;
      if (leftPanelVisible && W >= 900) {
        const r = scrollPane.getBoundingClientRect();
        target = Math.max(0, (W - r.left) / 2);
      }
      viewShift += (target - viewShift) * 0.14;
      if (Math.abs(target - viewShift) < 0.4) viewShift = target;
      if (!force && appliedShift !== null && Math.abs(viewShift - appliedShift) < 0.05) return;
      appliedShift = viewShift;
      if (viewShift === 0) camera.clearViewOffset();
      else camera.setViewOffset(W, H, viewShift, 0, W, H);
    }

    function onManualExplodeSlider(val) {
      targetExplode = Number(val) / 100;
      document.getElementById('explode-pct').textContent = `${val}%`;

    function resetCameraView() {

      desiredCamTarget.set(...ch.camTarget);

    /*************************************************************************
     * 10. ANIMATION LOOP (BLINKING LED CADENCES + SELECTIVE 3D GHOSTING)
     *************************************************************************/
    const clock = new THREE.Clock();

    function evaluateLedBlinkPattern(pattern, t) {
      switch (pattern) {
        case 'heartbeat':
          // Double-thump heartbeat pulse
          const hb = (t * 1.4) % 1.0;
          return (hb < 0.12 || (hb > 0.24 && hb < 0.36)) ? 2.8 : 0.75;
        case 'pps_1hz':
          // Crisp 1Hz GNSS PPS timing strobe
          return ((t % 1.0) < 0.18) ? 3.2 : 0.15;
        case 'cv2x_burst':
          // Rapid 10Hz C-V2X PC5 packet transmission blink
          return (Math.sin(t * 28.0) > 0.1) ? 3.0 : 0.12;
        case 'ble_strobe':
          // BLE 2.4 GHz advertisement double-blink
          const bm = (t * 0.9) % 1.0;
          return (bm < 0.08 || (bm > 0.16 && bm < 0.24)) ? 2.9 : 0.1;
        case 'data_flicker':
          // Pseudo-random cellular network activity blink
          return (Math.sin(t * 17.0) * Math.cos(t * 11.0) > 0.05) ? 2.7 : 0.18;
        default:
          return 1.5;
      }
    }

    function update3DPinsAndLeaderLine() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      const ch = SCROLL_CHAPTERS[activeChapterIdx];

      Object.values(pinDOMRegistry).forEach(({ item, badge }) => {
        const reg = partRegistry[item.id];
        if (!reg) return;
        const worldPos = reg.group.position.clone().add(reg.anchorOffset);
        worldPos.applyMatrix4(rootUnit.matrixWorld);
        const proj = worldPos.project(camera);
        if (proj.z > 1) {
          badge.style.display = 'none';
          return;
        }
        badge.style.display = 'flex';
        const x = (proj.x * 0.5 + 0.5) * w;
        const y = (-(proj.y * 0.5) + 0.5) * h;
        badge.style.left = `${x}px`;
        badge.style.top = `${y - 14}px`;
      });

      // Draw Technical Leader Line from Active Left Card to Primary Focused 3D Part
      const pathEl = document.getElementById('active-connector-path');
      const dotEl = document.getElementById('active-connector-dot');
      const ringEl = document.getElementById('active-connector-ring');

      if (!leftPanelVisible || !labelsVisible || !ch || ch.focusParts.includes('ALL')) {
        pathEl.setAttribute('d', '');
        dotEl.setAttribute('cx', -100);
        ringEl.setAttribute('cx', -100);
        return;
      }

      const primaryPartId = ch.focusParts[0];
      const reg = partRegistry[primaryPartId];
      const cardEl = document.getElementById(`card-${activeChapterIdx}`);

      if (reg && cardEl) {
        const rect = cardEl.getBoundingClientRect();
        const startX = rect.left;
        const startY = Math.max(80, Math.min(h - 80, rect.top + rect.height * 0.35));

        const worldTarget = reg.group.position.clone().add(reg.anchorOffset);
        worldTarget.applyMatrix4(rootUnit.matrixWorld);
        const proj = worldTarget.project(camera);
        const endX = (proj.x * 0.5 + 0.5) * w;
        const endY = (-(proj.y * 0.5) + 0.5) * h;

        const elbowX = startX + (endX - startX) * 0.45;
        pathEl.setAttribute('d', `M ${startX} ${startY} L ${elbowX} ${startY} L ${endX} ${endY}`);
        dotEl.setAttribute('cx', endX);
        dotEl.setAttribute('cy', endY);
        ringEl.setAttribute('cx', endX);
        ringEl.setAttribute('cy', endY);
      }
    }

    function animate() {
      requestAnimationFrame(animate);
      const elapsed = clock.getElapsedTime();
      const ch = SCROLL_CHAPTERS[activeChapterIdx];

      // 1. Smoothly Interpolate Mechanical Disassembly
      currentExplode += (targetExplode - currentExplode) * 0.085;

      Object.values(partRegistry).forEach((reg) => {
        if (reg.id === 'enclosure_lid') {
          const lidFactor = Math.min(1.15, currentExplode * 1.45);
          reg.group.position.copy(reg.basePos).addScaledVector(reg.explodeVec, lidFactor);
        } else {
          reg.group.position.copy(reg.basePos).addScaledVector(reg.explodeVec, currentExplode);
        }

        // 2. Selective 3D Focus vs Ghosting Non-Active Components
        const isFocused =
          !focusBlurEnabled ||
          !ch ||
          ch.focusParts.includes('ALL') ||
          ch.focusParts.includes(reg.id);

        const targetMix = isFocused ? 1.0 : 0.14;
        reg.focusMix += (targetMix - reg.focusMix) * 0.12;

        reg.meshes.forEach((m) => {
          const mat = m.material;
          if (!mat || mat.userData.isLed) return;
          mat.transparent = reg.focusMix < 0.98;
          mat.opacity = Math.max(0.14, reg.focusMix);
        });

        reg.lines.forEach((ln) => {
          ln.material.opacity = (ln.userData.baseEdgeOpacity || 0.75) * Math.max(0.18, reg.focusMix) * edgeScale;
        });
      });

      // 3. Realistic Multi-Cadence Blinking Status LEDs
      let totalLedEnergy = 0;
      blinkingLeds.forEach((item) => {
        const intensity = evaluateLedBlinkPattern(item.cfg.pattern, elapsed);
        item.ledMat.emissiveIntensity = intensity;
        if (item.halo && item.haloMat) {
          const norm = intensity / 3.2;
          item.haloMat.opacity = norm * 0.95;
          const s = 0.28 + norm * 0.48;
          item.halo.scale.set(s, s, 1);
          totalLedEnergy += norm;
        }
      });
      frontLedLight.intensity = (totalLedEnergy / 5) * 1.1;

      // 4. Subtle Volumetric Plume Breathing (Raptor 2 Test Stand Aesthetic)
      if (rfPlumeActive) {
        plumeSprites.forEach((sp, i) => {
          const pulse = 1 + 0.07 * Math.sin(elapsed * 3.5 + i);
          const b = sp.userData.baseScale * pulse;
          sp.scale.set(b, b, 1);
        });
      }

      // 5. Smooth Camera Glide (Yields immediately to user mouse drag/wheel zoom)
      if (cameraTransitioning) {
        camera.position.lerp(desiredCamPos, 0.07);
        controls.target.lerp(desiredCamTarget, 0.07);
        if (camera.position.distanceTo(desiredCamPos) < 0.08) {
          cameraTransitioning = false;
        }
      }

      controls.update();
      applyViewOffset(false);
      renderer.render(scene, camera);
      update3DPinsAndLeaderLine();
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      applyViewOffset(true);
    });

    window.onload = () => {
      applyTheme(document.documentElement.classList.contains('dark'), false);
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(applyMaterialStyle);
      viewShift = 0; applyViewOffset(true);
      selectChapter(0, false);
      animate();
    };
  </script>
</body>
</html>
