<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Enfibio Cinematic Swarm</title>
  <style>
    body, html { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; background: #010208; font-family: 'Share Tech Mono', 'Courier New', monospace; }
    canvas { display: block; position: absolute; top: 0; left: 0; z-index: 1; }
    #hud { position: absolute; inset: 0; z-index: 10; pointer-events: none; padding: 40px; display: flex; flex-direction: column; justify-content: space-between; }
    .scanlines { position: absolute; inset: 0; z-index: 100; pointer-events: none; background: repeating-linear-gradient(to bottom, transparent, transparent 2px, rgba(0,0,0,0.15) 2px, rgba(0,0,0,0.15) 4px); }
    .vignette { position: absolute; inset: 0; z-index: 90; pointer-events: none; background: radial-gradient(circle at center, transparent 40%, rgba(1,2,8,0.95) 120%); }
    .text-cyan { color: #00e5ff; text-shadow: 0 0 10px rgba(0,229,255,0.8); }
    .text-pink { color: #ff006e; text-shadow: 0 0 10px rgba(255,0,110,0.8); }
    .stat-block { margin-top: 10px; font-size: 11px; letter-spacing: 2px; }
    .status { font-size: 18px; font-weight: bold; letter-spacing: 4px; border-bottom: 1px solid rgba(0,229,255,0.3); padding-bottom: 5px; display: inline-block; }
    #message-log { text-align: right; }
    .log-line { font-size: 11px; letter-spacing: 2px; opacity: 0; transform: translateY(10px); color: rgba(255,255,255,0.6); margin-top: 8px;}
    .hud-brackets { position: absolute; width: 40px; height: 40px; border: 2px solid rgba(0,229,255,0.5); }
    .tl { top: 30px; left: 30px; border-right: none; border-bottom: none; }
    .tr { top: 30px; right: 30px; border-left: none; border-bottom: none; }
    .bl { bottom: 30px; left: 30px; border-right: none; border-top: none; }
    .br { bottom: 30px; right: 30px; border-left: none; border-top: none; }
    #loading { position: fixed; inset: 0; background: #010208; z-index: 500; display: flex; align-items: center; justify-content: center; color: #00e5ff; font-family: monospace; letter-spacing: 5px; transition: opacity 1s; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>

<div id="loading">UPLINKING ASSETS...</div>

<div class="scanlines"></div>
<div class="vignette"></div>

<!-- HUD Decorators -->
<div class="hud-brackets tl"></div>
<div class="hud-brackets tr"></div>
<div class="hud-brackets bl"></div>
<div class="hud-brackets br"></div>

<div id="hud">
  <div>
    <div class="status text-cyan" id="formation-status">GRID STANDBY</div>
    <div class="stat-block">MARL NODES: 60</div>
    <div class="stat-block text-pink" id="threat-indicator" style="opacity: 0;">THREAT DECLARED</div>
  </div>
  <div id="message-log">
    <!-- Log entries injected by GSAP -->
  </div>
</div>

<script>
// --- CORE SETUP ---
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x010208, 0.015);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 30, 80);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: 'high-performance' });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
document.body.appendChild(renderer.domElement);

// --- ENVIRONMENT ---
const ambient = new THREE.AmbientLight(0xffffff, 0.5);
scene.add(ambient);

const cyanLight = new THREE.PointLight(0x00e5ff, 2, 200);
cyanLight.position.set(-50, 20, 50);
scene.add(cyanLight);

const pinkLight = new THREE.PointLight(0xff006e, 1.5, 200);
pinkLight.position.set(50, 20, -50);
scene.add(pinkLight);

const threatLight = new THREE.PointLight(0xff0000, 0, 100);
threatLight.position.set(0, 0, 0);
scene.add(threatLight);

const gridHelper = new THREE.GridHelper(200, 100, 0x00e5ff, 0x00e5ff);
gridHelper.material.opacity = 0.05;
gridHelper.material.transparent = true;
gridHelper.position.y = -20;
scene.add(gridHelper);

// --- DRONE SWARM ASSETS ---
const numDrones = 60;
const drones = [];
let droneGeometry, droneMaterial;
// We'll use a very simple custom clone via Mesh wrapper if GLTF is complex
const loader = new THREE.GLTFLoader();

// --- MESH NETWORK LINES ---
const lineMaterial = new THREE.LineBasicMaterial({ color: 0x00e5ff, transparent: true, opacity: 0.15, blending: THREE.AdditiveBlending });
const lineGeometry = new THREE.BufferGeometry();
const linePositions = new Float32Array(numDrones * numDrones * 6); // Max possible lines
lineGeometry.setAttribute('position', new THREE.BufferAttribute(linePositions, 3));
const networkLines = new THREE.LineSegments(lineGeometry, lineMaterial);
scene.add(networkLines);

// --- TARGET SPHERE ---
const targetMesh = new THREE.Mesh(
  new THREE.OctahedronGeometry(2, 0),
  new THREE.MeshBasicMaterial({ color: 0xff0000, wireframe: true, transparent: true, opacity: 0 })
);
scene.add(targetMesh);

// DATA ---
loader.load('/battle_drone.glb', (gltf) => {
  document.getElementById('loading').style.opacity = '0';
  setTimeout(() => document.getElementById('loading').remove(), 1000);

  const baseModel = gltf.scene;
  baseModel.scale.set(0.5, 0.5, 0.5);

  for (let i = 0; i < numDrones; i++) {
    const d = baseModel.clone();
    
    // Grid Formation (Initial)
    const row = Math.floor(i / 10);
    const col = i % 10;
    const tx = (col - 4.5) * 12;
    const ty = (row - 2.5) * 6 + Math.random() * 2;
    const tz = (Math.random() - 0.5) * 15;

    d.position.set(tx, ty, tz);
    
    // Store variables for flight logic
    const droneState = {
      mesh: d,
      tx: tx, ty: ty, tz: tz, // Target X,Y,Z
      rx: 0, ry: 0, rz: 0,    // Target Rot
      noiseOffset: Math.random() * 100
    };
    
    scene.add(d);
    drones.push(droneState);
  }

  // Start Choreography Sequence
  startSequence();
});

function logMessage(msg) {
  const div = document.createElement('div');
  div.className = 'log-line';
  div.innerText = '> ' + msg;
  div.style.color = msg.includes('THREAT') ? '#ff006e' : '#00e5ff';
  document.getElementById('message-log').appendChild(div);
  gsap.to(div, { opacity: 1, y: 0, duration: 0.5 });
  if (document.getElementById('message-log').children.length > 5) {
    document.getElementById('message-log').firstChild.remove();
  }
}

// --- CHOREOGRAPHY TIMELINE ---
function startSequence() {
  const tl = gsap.timeline();

  // 1: TACTICAL PAN (0-5s)
  logMessage("SYSTEM ONLINE. SWARM DEPLOYED.");
  tl.to(camera.position, {
    x: -60, y: 15, z: 60,
    duration: 5, ease: "power2.inOut",
    onUpdate: () => camera.lookAt(0,0,0)
  }, 0);

  // 2: V-FORMATION ENGAGE (5-10s)
  tl.call(() => {
    document.getElementById('formation-status').innerText = 'V-FORMATION';
    logMessage("TRANSITION TO ASSAULT VECTOR");
    drones.forEach((d, i) => {
      // V-shape pointing along Z
      const rank = Math.floor(i / 2);
      const side = i % 2 === 0 ? 1 : -1;
      gsap.to(d, {
        tx: rank * 4 * side,
        ty: 5 + Math.random() * 2,
        tz: rank * 6 - 30, // Tail going back
        duration: 3 + Math.random(),
        ease: "power3.inOut"
      });
      gsap.to(d, {
        ry: Math.PI,
        duration: 3
      });
    });
  }, [], 5);

  tl.to(camera.position, {
    x: 0, y: 40, z: -80,
    duration: 6, ease: "power1.inOut",
    onUpdate: () => camera.lookAt(0,0,0)
  }, 5);

  // 3: THREAT DETECTED & CLUSTER TRACKING (12-20s)
  tl.call(() => {
    document.getElementById('formation-status').innerText = 'INTERCEPT CLUSTER';
    document.getElementById('threat-indicator').style.opacity = '1';
    logMessage("THREAT SIGNATURE DETECTED: [UNK-72X]");
    
    // Spawn threat
    targetMesh.position.set(-30, -5, -20);
    gsap.to(targetMesh.material, { opacity: 1, duration: 1 });
    gsap.to(threatLight, { intensity: 5, duration: 1 });
    
    // Threat moves fast
    gsap.to(targetMesh.position, { x: 40, y: 15, z: 20, duration: 6, ease: "power2.inOut" });
    gsap.to(threatLight.position, { x: 40, y: 15, z: 20, duration: 6, ease: "power2.inOut" });

    // Drones cluster around threat
    drones.forEach((d, i) => {
      const radius = 8 + Math.random() * 12;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos((Math.random() * 2) - 1);
      
      const ox = radius * Math.sin(phi) * Math.cos(theta);
      const oy = radius * Math.sin(phi) * Math.sin(theta);
      const oz = radius * Math.cos(phi);

      gsap.to(d, {
        tx: targetMesh.position.x + ox,
        ty: targetMesh.position.y + oy,
        tz: targetMesh.position.z + oz,
        duration: 2 + Math.random() * 2,
        ease: "back.out(1.2)"
      });
    });
  }, [], 12);

  tl.to(camera.position, {
    x: 40, y: 30, z: 60,
    duration: 6, ease: "power1.inOut",
    onUpdate: () => camera.lookAt(targetMesh.position)
  }, 12);

  // Threat tracked dynamically via RAF
  tl.call(() => {
    // Update drone cluster dynamically to follow target
    const interval = setInterval(() => {
      drones.forEach((d, i) => {
        const radius = 10 + Math.random() * 14;
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos((Math.random() * 2) - 1);
        d.tx = targetMesh.position.x + radius * Math.sin(phi) * Math.cos(theta);
        d.ty = targetMesh.position.y + radius * Math.sin(phi) * Math.sin(theta);
        d.tz = targetMesh.position.z + radius * Math.cos(phi);
      });
    }, 1000);
    setTimeout(() => clearInterval(interval), 6000);
  }, [], 14);

  // 4: NEUTRALIZED & RETURN TO SEARCH (21-28s)
  tl.call(() => {
    logMessage("THREAT NEUTRALIZED. RESUMING PATROL.");
    document.getElementById('formation-status').innerText = 'RADIAL PATROL';
    document.getElementById('threat-indicator').style.opacity = '0';
    gsap.to(targetMesh.material, { opacity: 0, duration: 0.5 });
    gsap.to(threatLight, { intensity: 0, duration: 0.5 });

    drones.forEach((d, i) => {
      const angle = (i / numDrones) * Math.PI * 2;
      const r = 35 + (i % 3) * 10;
      gsap.to(d, {
        tx: Math.cos(angle) * r,
        ty: Math.sin(angle * 3) * 5 + 10,
        tz: Math.sin(angle) * r,
        ry: -angle - Math.PI/2,
        duration: 4,
        ease: "power2.inOut"
      });
    });
  }, [], 21);

  tl.to(camera.position, {
    x: 0, y: 80, z: 20, // Tactical top-down
    duration: 5, ease: "power2.inOut",
    onUpdate: () => camera.lookAt(0,0,0)
  }, 21);
}

const clock = new THREE.Clock();
// --- ANIMATION LOOP ---
function animate() {
  requestAnimationFrame(animate);
  const time = clock.getElapsedTime();

  // Interpolate drones and draw connections
  let lineIdx = 0;
  
  if (drones.length > 0) {
    targetMesh.rotation.x += 0.05;
    targetMesh.rotation.y += 0.05;

    for (let i = 0; i < numDrones; i++) {
      const d = drones[i];
      // Physics lerp to target
      d.mesh.position.x += (d.tx - d.mesh.position.x) * 0.05;
      d.mesh.position.y += (d.ty - d.mesh.position.y) * 0.05;
      d.mesh.position.z += (d.tz - d.mesh.position.z) * 0.05;
      
      // Floating offset
      const floatY = Math.sin(time * 3 + d.noiseOffset) * 0.5;
      d.mesh.position.y += floatY * 0.05;

      // Rotation lerp
      d.mesh.rotation.y += (d.ry - d.mesh.rotation.y) * 0.05;
      
      // Pitching based on movement
      const dx = d.tx - d.mesh.position.x;
      const dz = d.tz - d.mesh.position.z;
      const speed = Math.sqrt(dx*dx + dz*dz);
      d.mesh.rotation.x = Math.max(-0.5, Math.min(0.5, speed * 0.02)); 

      // Connect to nearby
      for (let j = i + 1; j < numDrones; j++) {
        const d2 = drones[j];
        const dist = d.mesh.position.distanceTo(d2.mesh.position);
        if (dist < 18) { // Connected threshold
          linePositions[lineIdx++] = d.mesh.position.x;
          linePositions[lineIdx++] = d.mesh.position.y;
          linePositions[lineIdx++] = d.mesh.position.z;
          linePositions[lineIdx++] = d2.mesh.position.x;
          linePositions[lineIdx++] = d2.mesh.position.y;
          linePositions[lineIdx++] = d2.mesh.position.z;
        }
      }
    }
  }

  // Clear rest of line buffer
  for (let k = lineIdx; k < linePositions.length; k++) {
    linePositions[k] = 0;
  }
  lineGeometry.attributes.position.needsUpdate = true;

  renderer.render(scene, camera);
}

animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
